name: Ingest

# Daily check of the upstream changelog (ADR 0006, ADR 0010). It only writes release records:
# summaries are drafted later in a Claude Code session. Needs a GitHub App installed on this
# repository with contents: write and pull-requests: write; see docs/operations.md.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  # Keep in step with config.ingestBranch in pipeline/src/config.ts.
  INGEST_BRANCH: bot/ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingest
      - run: pnpm validate
      # The write token is created only now, so installing and running dependencies above
      # happens without it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update the ingest pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git add content/releases content/runs
          if git diff --cached --quiet; then
            echo "Nothing new upstream."
            exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git switch --create "$INGEST_BRANCH"
          git commit --message "Ingest new and changed releases"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$INGEST_BRANCH"
          if [ -z "$(gh pr list --head "$INGEST_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$INGEST_BRANCH" \
              --title "Ingest new and changed releases" \
              --body "Release records written by the daily ingest run. New releases show as \"summary coming\" until their summaries are drafted (\`draft-summary\` skill) and approved."
          fi
